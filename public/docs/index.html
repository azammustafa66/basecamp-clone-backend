<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basecamp Clone API</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist/swagger-ui.css" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: sans-serif; background: #fafafa; }
      #swagger-ui .topbar { background: #1a1a2e; }
      #swagger-ui .topbar .download-url-wrapper { display: none; }
    </style>
  </head>
  <body>
    <div id="swagger-ui"></div>

    <script src="https://unpkg.com/swagger-ui-dist/swagger-ui-bundle.js"></script>
    <script>
      const spec = {
        openapi: '3.0.3',
        info: {
          title: 'Basecamp Clone API',
          version: '1.0.0',
          description:
            'Role-gated REST API for a collaborative project management tool inspired by Basecamp. Teams organise work into projects, break projects into tasks, track progress through subtasks, and communicate through shared notes. Email notifications are handled asynchronously via BullMQ + Redis.',
          contact: { name: 'Azam Mustufa' },
        },
        servers: [
          { url: 'https://basecamp-clone-backend-1.onrender.com/api/v1', description: 'Production' },
          { url: 'http://localhost:3000/api/v1', description: 'Local' },
        ],

        components: {
          securitySchemes: {
            bearerAuth: {
              type: 'http',
              scheme: 'bearer',
              bearerFormat: 'JWT',
              description: 'Paste your access token from the login response.',
            },
          },
          schemas: {
            APIResponse: {
              type: 'object',
              properties: {
                statusCode: { type: 'integer', example: 200 },
                success:    { type: 'boolean', example: true },
                message:    { type: 'string' },
                data:       { type: 'object' },
              },
            },
            APIError: {
              type: 'object',
              properties: {
                statusCode: { type: 'integer', example: 400 },
                success:    { type: 'boolean', example: false },
                message:    { type: 'string' },
                errors:     { type: 'array', items: { type: 'string' } },
              },
            },
            User: {
              type: 'object',
              properties: {
                _id:             { type: 'string',  example: '664a1c2f3e4b5a6d7f8e9b0c' },
                userName:        { type: 'string',  example: 'johndoe' },
                email:           { type: 'string',  format: 'email', example: 'john@example.com' },
                fullName:        { type: 'string',  example: 'John Doe' },
                isEmailVerified: { type: 'boolean', example: true },
                avatar: {
                  type: 'object',
                  properties: {
                    url:       { type: 'string' },
                    localPath: { type: 'string' },
                  },
                },
              },
            },
            Project: {
              type: 'object',
              properties: {
                _id:         { type: 'string', example: '664a1c2f3e4b5a6d7f8e9b0c' },
                name:        { type: 'string', example: 'Website Redesign' },
                description: { type: 'string', example: 'Redesign the company website' },
                createdAt:   { type: 'string', format: 'date-time' },
              },
            },
            ProjectMember: {
              type: 'object',
              properties: {
                user: { $ref: '#/components/schemas/User' },
                role: { type: 'string', enum: ['admin', 'member'] },
              },
            },
            Task: {
              type: 'object',
              properties: {
                _id:         { type: 'string' },
                title:       { type: 'string', example: 'Design homepage' },
                description: { type: 'string' },
                project:     { type: 'string' },
                assignedBy:  { $ref: '#/components/schemas/User' },
                assignedTo:  { type: 'array', items: { $ref: '#/components/schemas/User' } },
                status:      { type: 'string', enum: ['todo', 'inProgress', 'done'], example: 'todo' },
                attachments: {
                  type: 'array',
                  items: {
                    type: 'object',
                    properties: {
                      url:      { type: 'string' },
                      mimeType: { type: 'string' },
                      size:     { type: 'number' },
                    },
                  },
                },
                createdAt: { type: 'string', format: 'date-time' },
              },
            },
            SubTask: {
              type: 'object',
              properties: {
                _id:         { type: 'string' },
                title:       { type: 'string', example: 'Write copy for hero section' },
                task:        { type: 'string' },
                isCompleted: { type: 'boolean', example: false },
                createdBy:   { $ref: '#/components/schemas/User' },
                createdAt:   { type: 'string', format: 'date-time' },
              },
            },
            Note: {
              type: 'object',
              properties: {
                _id:       { type: 'string' },
                project:   { type: 'string' },
                content:   { type: 'string', example: 'Meeting notes from Monday standup' },
                createdBy: { $ref: '#/components/schemas/User' },
                createdAt: { type: 'string', format: 'date-time' },
              },
            },
          },
        },

        security: [{ bearerAuth: [] }],

        tags: [
          { name: 'Auth',     description: 'Registration, login, and token management' },
          { name: 'Projects', description: 'Project CRUD and member management' },
          { name: 'Tasks',    description: 'Task management within a project' },
          { name: 'Subtasks', description: 'Subtask tracking within a task' },
          { name: 'Notes',    description: 'Project-level notes and comments' },
        ],

        paths: {

          // ── Auth ─────────────────────────────────────────────────────────────

          '/auth/register': {
            post: {
              tags: ['Auth'],
              summary: 'Register',
              security: [],
              requestBody: {
                required: true,
                content: {
                  'application/json': {
                    schema: {
                      type: 'object',
                      required: ['userName', 'email', 'password'],
                      properties: {
                        userName: { type: 'string', example: 'johndoe' },
                        email:    { type: 'string', format: 'email', example: 'john@example.com' },
                        password: { type: 'string', minLength: 8, example: 'secret123' },
                        fullName: { type: 'string', example: 'John Doe' },
                      },
                    },
                  },
                },
              },
              responses: {
                201: {
                  description: 'User created — verification email queued',
                  content: {
                    'application/json': {
                      schema: {
                        allOf: [
                          { $ref: '#/components/schemas/APIResponse' },
                          { properties: { data: { properties: { user: { $ref: '#/components/schemas/User' } } } } },
                        ],
                      },
                    },
                  },
                },
                400: { description: 'Validation error' },
                409: { description: 'Email or username already taken' },
              },
            },
          },

          '/auth/login': {
            post: {
              tags: ['Auth'],
              summary: 'Login',
              security: [],
              description: 'Returns `accessToken` and `refreshToken` in the response body and sets them as httpOnly cookies.',
              requestBody: {
                required: true,
                content: {
                  'application/json': {
                    schema: {
                      type: 'object',
                      required: ['email', 'password'],
                      properties: {
                        email:    { type: 'string', format: 'email', example: 'john@example.com' },
                        password: { type: 'string', example: 'secret123' },
                      },
                    },
                  },
                },
              },
              responses: {
                200: {
                  description: 'Logged in',
                  content: {
                    'application/json': {
                      schema: {
                        allOf: [
                          { $ref: '#/components/schemas/APIResponse' },
                          {
                            properties: {
                              data: {
                                properties: {
                                  user:         { $ref: '#/components/schemas/User' },
                                  accessToken:  { type: 'string' },
                                  refreshToken: { type: 'string' },
                                },
                              },
                            },
                          },
                        ],
                      },
                    },
                  },
                },
                401: { description: 'Invalid credentials' },
                404: { description: 'User not found' },
              },
            },
          },

          '/auth/logout': {
            post: {
              tags: ['Auth'],
              summary: 'Logout',
              description: 'Clears cookies and invalidates the refresh token server-side.',
              responses: {
                200: { description: 'Logged out' },
                401: { description: 'Unauthorized' },
              },
            },
          },

          '/auth/refresh-token': {
            post: {
              tags: ['Auth'],
              summary: 'Rotate tokens',
              description: 'Issues a new access + refresh token pair. The old refresh token is immediately invalidated. Reusing an old token invalidates the entire family (reuse detection).',
              requestBody: {
                content: {
                  'application/json': {
                    schema: {
                      type: 'object',
                      properties: { refreshToken: { type: 'string', description: 'Or send via cookie' } },
                    },
                  },
                },
              },
              responses: {
                200: { description: 'Tokens rotated' },
                401: { description: 'Refresh token invalid or expired' },
              },
            },
          },

          '/auth/verify-email/{token}': {
            get: {
              tags: ['Auth'],
              summary: 'Verify email',
              security: [],
              description: 'Token is sent in the verification email. Tokens are stored as SHA-256 hashes and expire after 24 hours.',
              parameters: [
                { name: 'token', in: 'path', required: true, schema: { type: 'string' } },
              ],
              responses: {
                200: { description: 'Email verified' },
                400: { description: 'Token invalid or expired' },
              },
            },
          },

          '/auth/resend-email-verification': {
            post: {
              tags: ['Auth'],
              summary: 'Resend verification email',
              responses: {
                200: { description: 'Verification email queued' },
                400: { description: 'Email already verified' },
              },
            },
          },

          '/auth/forgot-password': {
            post: {
              tags: ['Auth'],
              summary: 'Request password reset',
              security: [],
              description: 'Always returns `200` regardless of whether the email exists — prevents email enumeration.',
              requestBody: {
                required: true,
                content: {
                  'application/json': {
                    schema: {
                      type: 'object',
                      required: ['email'],
                      properties: { email: { type: 'string', format: 'email' } },
                    },
                  },
                },
              },
              responses: { 200: { description: 'Reset link queued if account exists' } },
            },
          },

          '/auth/reset-password/{token}': {
            post: {
              tags: ['Auth'],
              summary: 'Reset password',
              security: [],
              description: 'Token is single-use and expires after 24 hours.',
              parameters: [
                { name: 'token', in: 'path', required: true, schema: { type: 'string' } },
              ],
              requestBody: {
                required: true,
                content: {
                  'application/json': {
                    schema: {
                      type: 'object',
                      required: ['newPassword'],
                      properties: { newPassword: { type: 'string', minLength: 8 } },
                    },
                  },
                },
              },
              responses: {
                200: { description: 'Password reset' },
                400: { description: 'Token invalid or expired' },
              },
            },
          },

          '/auth/change-password': {
            post: {
              tags: ['Auth'],
              summary: 'Change password',
              requestBody: {
                required: true,
                content: {
                  'application/json': {
                    schema: {
                      type: 'object',
                      required: ['oldPassword', 'newPassword'],
                      properties: {
                        oldPassword: { type: 'string' },
                        newPassword: { type: 'string', minLength: 8 },
                      },
                    },
                  },
                },
              },
              responses: {
                200: { description: 'Password changed' },
                400: { description: 'Old password incorrect' },
              },
            },
          },

          // ── Projects ─────────────────────────────────────────────────────────

          '/project': {
            get: {
              tags: ['Projects'],
              summary: 'List my projects',
              description: 'Returns all projects the authenticated user is a member of.',
              responses: {
                200: {
                  description: 'Projects fetched',
                  content: {
                    'application/json': {
                      schema: {
                        allOf: [
                          { $ref: '#/components/schemas/APIResponse' },
                          { properties: { data: { properties: { projects: { type: 'array', items: { $ref: '#/components/schemas/Project' } } } } } },
                        ],
                      },
                    },
                  },
                },
              },
            },
            post: {
              tags: ['Projects'],
              summary: 'Create project',
              description: 'The creator is automatically assigned the `admin` role.',
              requestBody: {
                required: true,
                content: {
                  'application/json': {
                    schema: {
                      type: 'object',
                      required: ['name'],
                      properties: {
                        name:        { type: 'string', example: 'Website Redesign' },
                        description: { type: 'string' },
                      },
                    },
                  },
                },
              },
              responses: {
                201: {
                  description: 'Project created — confirmation email sent to creator',
                  content: {
                    'application/json': {
                      schema: {
                        allOf: [
                          { $ref: '#/components/schemas/APIResponse' },
                          { properties: { data: { properties: { project: { $ref: '#/components/schemas/Project' } } } } },
                        ],
                      },
                    },
                  },
                },
              },
            },
          },

          '/project/{projectId}': {
            patch: {
              tags: ['Projects'],
              summary: 'Update project',
              description: 'Admin only. All project admins are notified by email.',
              parameters: [
                { name: 'projectId', in: 'path', required: true, schema: { type: 'string' } },
              ],
              requestBody: {
                content: {
                  'application/json': {
                    schema: {
                      type: 'object',
                      properties: {
                        name:        { type: 'string' },
                        description: { type: 'string' },
                      },
                    },
                  },
                },
              },
              responses: {
                200: { description: 'Project updated' },
                403: { description: 'Not an admin' },
                404: { description: 'Project not found' },
              },
            },
            delete: {
              tags: ['Projects'],
              summary: 'Delete project',
              description: 'Admin only. Removes all membership records.',
              parameters: [
                { name: 'projectId', in: 'path', required: true, schema: { type: 'string' } },
              ],
              responses: {
                200: { description: 'Project deleted' },
                403: { description: 'Not an admin' },
                404: { description: 'Project not found' },
              },
            },
          },

          '/project/{projectId}/members': {
            get: {
              tags: ['Projects'],
              summary: 'List members',
              parameters: [
                { name: 'projectId', in: 'path', required: true, schema: { type: 'string' } },
              ],
              responses: {
                200: {
                  description: 'Members fetched',
                  content: {
                    'application/json': {
                      schema: {
                        allOf: [
                          { $ref: '#/components/schemas/APIResponse' },
                          { properties: { data: { properties: { members: { type: 'array', items: { $ref: '#/components/schemas/ProjectMember' } } } } } },
                        ],
                      },
                    },
                  },
                },
              },
            },
            post: {
              tags: ['Projects'],
              summary: 'Add members',
              description: 'Admin only. Each added user receives a welcome email.',
              parameters: [
                { name: 'projectId', in: 'path', required: true, schema: { type: 'string' } },
              ],
              requestBody: {
                required: true,
                content: {
                  'application/json': {
                    schema: {
                      type: 'array',
                      items: {
                        type: 'object',
                        required: ['userId', 'role'],
                        properties: {
                          userId: { type: 'string', example: '664a1c2f3e4b5a6d7f8e9b0c' },
                          role:   { type: 'string', enum: ['admin', 'member'] },
                        },
                      },
                      example: [
                        { userId: '664a1c2f3e4b5a6d7f8e9b0c', role: 'member' },
                        { userId: '664b2d3f4e5c6a7e8f9c0d1e', role: 'admin' },
                      ],
                    },
                  },
                },
              },
              responses: {
                200: { description: 'Members added' },
                403: { description: 'Not an admin' },
              },
            },
          },

          '/project/{projectId}/members/{userId}': {
            patch: {
              tags: ['Projects'],
              summary: 'Update member role',
              description: 'Admin only. Admins cannot change their own role. Users promoted to `admin` receive a notification email.',
              parameters: [
                { name: 'projectId', in: 'path', required: true, schema: { type: 'string' } },
                { name: 'userId',    in: 'path', required: true, schema: { type: 'string' } },
              ],
              requestBody: {
                required: true,
                content: {
                  'application/json': {
                    schema: {
                      type: 'object',
                      required: ['role'],
                      properties: { role: { type: 'string', enum: ['admin', 'member'] } },
                    },
                  },
                },
              },
              responses: {
                200: { description: 'Role updated' },
                400: { description: 'Cannot change own role' },
                403: { description: 'Not an admin' },
              },
            },
            delete: {
              tags: ['Projects'],
              summary: 'Remove member',
              description: 'Admin only. Admins cannot remove themselves.',
              parameters: [
                { name: 'projectId', in: 'path', required: true, schema: { type: 'string' } },
                { name: 'userId',    in: 'path', required: true, schema: { type: 'string' } },
              ],
              responses: {
                200: { description: 'Member removed' },
                400: { description: 'Cannot remove yourself' },
                403: { description: 'Not an admin' },
              },
            },
          },

          // ── Tasks ─────────────────────────────────────────────────────────────

          '/project/{projectId}/task': {
            get: {
              tags: ['Tasks'],
              summary: 'List tasks',
              description: 'Returns all tasks in the project, sorted newest first, with populated assignees.',
              parameters: [
                { name: 'projectId', in: 'path', required: true, schema: { type: 'string' } },
              ],
              responses: {
                200: {
                  description: 'Tasks fetched',
                  content: {
                    'application/json': {
                      schema: {
                        allOf: [
                          { $ref: '#/components/schemas/APIResponse' },
                          { properties: { data: { properties: { tasks: { type: 'array', items: { $ref: '#/components/schemas/Task' } } } } } },
                        ],
                      },
                    },
                  },
                },
              },
            },
            post: {
              tags: ['Tasks'],
              summary: 'Create task',
              description: 'Any project member can create a task. Each assignee is notified by email. Send as `multipart/form-data` when including file attachments.',
              parameters: [
                { name: 'projectId', in: 'path', required: true, schema: { type: 'string' } },
              ],
              requestBody: {
                required: true,
                content: {
                  'multipart/form-data': {
                    schema: {
                      type: 'object',
                      required: ['title'],
                      properties: {
                        title:       { type: 'string', example: 'Design homepage' },
                        description: { type: 'string' },
                        assignedTo:  { type: 'array', items: { type: 'string' }, description: 'Array of user IDs' },
                        status:      { type: 'string', enum: ['todo', 'inProgress', 'done'], default: 'todo' },
                        attachments: { type: 'array', items: { type: 'string', format: 'binary' }, description: 'Max 1 MB each' },
                      },
                    },
                  },
                },
              },
              responses: {
                201: {
                  description: 'Task created — assignees notified by email',
                  content: {
                    'application/json': {
                      schema: {
                        allOf: [
                          { $ref: '#/components/schemas/APIResponse' },
                          { properties: { data: { properties: { task: { $ref: '#/components/schemas/Task' } } } } },
                        ],
                      },
                    },
                  },
                },
                400: { description: 'Title is required' },
              },
            },
          },

          '/project/{projectId}/{taskId}': {
            patch: {
              tags: ['Tasks'],
              summary: 'Update task',
              description: 'Accessible to the task assigner, any assignee, or a project admin. Status change notifies all current assignees. New assignees are notified; existing ones are not re-notified.',
              parameters: [
                { name: 'projectId', in: 'path', required: true, schema: { type: 'string' } },
                { name: 'taskId',    in: 'path', required: true, schema: { type: 'string' } },
              ],
              requestBody: {
                content: {
                  'multipart/form-data': {
                    schema: {
                      type: 'object',
                      properties: {
                        title:       { type: 'string' },
                        description: { type: 'string' },
                        status:      { type: 'string', enum: ['todo', 'inProgress', 'done'] },
                        assignedTo:  { type: 'array', items: { type: 'string' } },
                        attachments: { type: 'array', items: { type: 'string', format: 'binary' } },
                      },
                    },
                  },
                },
              },
              responses: {
                200: { description: 'Task updated' },
                403: { description: 'Not the assigner, an assignee, or an admin' },
                404: { description: 'Task not found' },
              },
            },
            delete: {
              tags: ['Tasks'],
              summary: 'Delete task',
              description: 'Only the task creator or a project admin can delete. Cascades to delete all subtasks. All assignees are notified by email.',
              parameters: [
                { name: 'projectId', in: 'path', required: true, schema: { type: 'string' } },
                { name: 'taskId',    in: 'path', required: true, schema: { type: 'string' } },
              ],
              responses: {
                200: { description: 'Task deleted — assignees notified' },
                403: { description: 'Not the task creator or an admin' },
                404: { description: 'Task not found' },
              },
            },
          },

          // ── Subtasks ──────────────────────────────────────────────────────────

          '/project/{projectId}/{taskId}/subtask': {
            get: {
              tags: ['Subtasks'],
              summary: 'List subtasks',
              description: 'Accessible to the task assigner, any assignee, or a project admin.',
              parameters: [
                { name: 'projectId', in: 'path', required: true, schema: { type: 'string' } },
                { name: 'taskId',    in: 'path', required: true, schema: { type: 'string' } },
              ],
              responses: {
                200: {
                  description: 'Subtasks fetched',
                  content: {
                    'application/json': {
                      schema: {
                        allOf: [
                          { $ref: '#/components/schemas/APIResponse' },
                          { properties: { data: { properties: { subtasks: { type: 'array', items: { $ref: '#/components/schemas/SubTask' } } } } } },
                        ],
                      },
                    },
                  },
                },
              },
            },
            post: {
              tags: ['Subtasks'],
              summary: 'Create subtask',
              parameters: [
                { name: 'projectId', in: 'path', required: true, schema: { type: 'string' } },
                { name: 'taskId',    in: 'path', required: true, schema: { type: 'string' } },
              ],
              requestBody: {
                required: true,
                content: {
                  'application/json': {
                    schema: {
                      type: 'object',
                      required: ['title'],
                      properties: { title: { type: 'string', example: 'Write copy for hero section' } },
                    },
                  },
                },
              },
              responses: {
                201: {
                  description: 'Subtask created',
                  content: {
                    'application/json': {
                      schema: {
                        allOf: [
                          { $ref: '#/components/schemas/APIResponse' },
                          { properties: { data: { properties: { subtask: { $ref: '#/components/schemas/SubTask' } } } } },
                        ],
                      },
                    },
                  },
                },
              },
            },
          },

          '/project/{projectId}/{taskId}/subtask/{subtaskId}': {
            patch: {
              tags: ['Subtasks'],
              summary: 'Update subtask',
              parameters: [
                { name: 'projectId',  in: 'path', required: true, schema: { type: 'string' } },
                { name: 'taskId',     in: 'path', required: true, schema: { type: 'string' } },
                { name: 'subtaskId',  in: 'path', required: true, schema: { type: 'string' } },
              ],
              requestBody: {
                content: {
                  'application/json': {
                    schema: {
                      type: 'object',
                      properties: {
                        title:       { type: 'string' },
                        isCompleted: { type: 'boolean' },
                      },
                    },
                  },
                },
              },
              responses: {
                200: { description: 'Subtask updated' },
                403: { description: 'Not authorised for this task' },
                404: { description: 'Subtask not found' },
              },
            },
            delete: {
              tags: ['Subtasks'],
              summary: 'Delete subtask',
              description: 'Only the subtask creator or a project admin can delete.',
              parameters: [
                { name: 'projectId',  in: 'path', required: true, schema: { type: 'string' } },
                { name: 'taskId',     in: 'path', required: true, schema: { type: 'string' } },
                { name: 'subtaskId',  in: 'path', required: true, schema: { type: 'string' } },
              ],
              responses: {
                200: { description: 'Subtask deleted' },
                403: { description: 'Not the creator or an admin' },
                404: { description: 'Subtask not found' },
              },
            },
          },

          // ── Notes ─────────────────────────────────────────────────────────────

          '/project/{projectId}/notes': {
            get: {
              tags: ['Notes'],
              summary: 'List notes',
              description: 'Returns all notes in the project, newest first, with populated author.',
              parameters: [
                { name: 'projectId', in: 'path', required: true, schema: { type: 'string' } },
              ],
              responses: {
                200: {
                  description: 'Notes fetched',
                  content: {
                    'application/json': {
                      schema: {
                        allOf: [
                          { $ref: '#/components/schemas/APIResponse' },
                          { properties: { data: { properties: { notes: { type: 'array', items: { $ref: '#/components/schemas/Note' } } } } } },
                        ],
                      },
                    },
                  },
                },
              },
            },
            post: {
              tags: ['Notes'],
              summary: 'Create note',
              parameters: [
                { name: 'projectId', in: 'path', required: true, schema: { type: 'string' } },
              ],
              requestBody: {
                required: true,
                content: {
                  'application/json': {
                    schema: {
                      type: 'object',
                      required: ['content'],
                      properties: { content: { type: 'string', example: 'Meeting notes from Monday standup' } },
                    },
                  },
                },
              },
              responses: {
                201: {
                  description: 'Note created',
                  content: {
                    'application/json': {
                      schema: {
                        allOf: [
                          { $ref: '#/components/schemas/APIResponse' },
                          { properties: { data: { properties: { note: { $ref: '#/components/schemas/Note' } } } } },
                        ],
                      },
                    },
                  },
                },
              },
            },
          },

          '/project/{projectId}/notes/{noteId}': {
            patch: {
              tags: ['Notes'],
              summary: 'Update note',
              description: 'Only the note author or a project admin.',
              parameters: [
                { name: 'projectId', in: 'path', required: true, schema: { type: 'string' } },
                { name: 'noteId',    in: 'path', required: true, schema: { type: 'string' } },
              ],
              requestBody: {
                required: true,
                content: {
                  'application/json': {
                    schema: {
                      type: 'object',
                      required: ['content'],
                      properties: { content: { type: 'string' } },
                    },
                  },
                },
              },
              responses: {
                200: { description: 'Note updated' },
                403: { description: 'Not the author or an admin' },
                404: { description: 'Note not found' },
              },
            },
            delete: {
              tags: ['Notes'],
              summary: 'Delete note',
              description: 'Only the note author or a project admin.',
              parameters: [
                { name: 'projectId', in: 'path', required: true, schema: { type: 'string' } },
                { name: 'noteId',    in: 'path', required: true, schema: { type: 'string' } },
              ],
              responses: {
                200: { description: 'Note deleted' },
                403: { description: 'Not the author or an admin' },
                404: { description: 'Note not found' },
              },
            },
          },

        },
      };

      SwaggerUIBundle({
        spec,
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIBundle.SwaggerUIStandalonePreset],
        layout: 'BaseLayout',
        tryItOutEnabled: true,
      });
    </script>
  </body>
